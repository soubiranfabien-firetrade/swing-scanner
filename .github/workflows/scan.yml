name: Scan Swing Pullback

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "40 6-22 * * 1-5"
  workflow_dispatch:
    inputs:
      tf:
        description: "Unites de temps (ex : 1d 1wk 2h)"
        default: "1d 1wk 2h"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choisir les unites de temps
        id: tf
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TF: ${{ github.event.inputs.tf }}
        run: |
          if [ "$SCHEDULE" = "30 5 * * *" ]; then echo "tfs=1d 1wk" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "40 6-22 * * 1-5" ]; then echo "tfs=2h" >> "$GITHUB_OUTPUT"
          else echo "tfs=${INPUT_TF:-1d 1wk 2h}" >> "$GITHUB_OUTPUT"; fi

      - name: Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TFS: ${{ steps.tf.outputs.tfs }}
        run: python scanner.py --tf $TFS

      - name: Sauvegarder etat et tableau de bord
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json docs/index.html
          git commit -m "scan $(date -u +'%Y-%m-%d %H:%M')" || echo "rien a enregistrer"
          git pull --rebase || true
          git push
